<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transaktionsdatensatz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 900px;
    }

    caption {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 1rem;
      text-align: left;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 0.6rem;
      text-align: left;
    }

    thead {
      background-color: #f2f2f2;
    }

    tbody tr:nth-child(even) {
      background-color: #fafafa;
    }
  </style>
</head>
<body>
  <table>
    <caption>Transaktionen</caption>
    <thead>
      <tr>
        <th scope="col">Datum</th>
        <th scope="col">TransaktionsID</th>
        <th scope="col">Währung</th>
        <th scope="col">Betrag</th>
        <th scope="col">Beschreibung</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>22.10.2023</td>
        <td>TXN001</td>
        <td>EUR</td>
        <td>100.00</td>
        <td>Einkauf im Supermarkt</td>
      </tr>
      <tr>
        <td>23.10.2023</td>
        <td>TXN002</td>
        <td>USD</td>
        <td>250.50</td>
        <td>Online-Kauf</td>
      </tr>
      <tr>
        <td>23.10.2023</td>
        <td>TXN003</td>
        <td>EUR</td>
        <td>75.20</td>
        <td>Restaurantbesuch</td>
      </tr>
      <tr>
        <td>24.10.2023</td>
        <td>TXN004</td>
        <td>GBP</td>
        <td>150.00</td>
        <td>Buchung im Hotel</td>
      </tr>
      <tr>
        <td>25.10.2023</td>
        <td>TXN005</td>
        <td>EUR</td>
        <td>200.00</td>
        <td>Autoreparatur</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
